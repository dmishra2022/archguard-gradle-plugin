[versions]
# Core
java              = "17"
kotlin            = "2.0.21"
gradle-plugin-api = "9.0.0"

# ArchGuard SDK (resolved from mavenLocal() for 0.1.0; move to Maven Central
# coordinates once the SDK publishes there).
archguard         = "0.1.0"

# ArchUnit shared library
archunit          = "1.4.1"

# Jackson is pulled transitively by ArchGuard but we also use it directly in the
# plugin for policy inspection in tests.
jackson           = "2.18.3"

# Testing
junit             = "5.11.4"
assertj           = "3.27.3"

[libraries]
archguard-api            = { module = "io.archguard:archguard-api",       version.ref = "archguard" }
archguard-core           = { module = "io.archguard:archguard-core",      version.ref = "archguard" }
archunit                 = { module = "com.tngtech.archunit:archunit",             version.ref = "archunit" }
archunit-junit5          = { module = "com.tngtech.archunit:archunit-junit5",      version.ref = "archunit" }
jackson-databind         = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations      = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
junit-bom                = { module = "org.junit:junit-bom",              version.ref = "junit" }
junit-jupiter            = { module = "org.junit.jupiter:junit-jupiter" }
assertj                  = { module = "org.assertj:assertj-core",         version.ref = "assertj" }

[plugins]
kotlin-jvm       = { id = "org.jetbrains.kotlin.jvm",     version.ref = "kotlin" }
