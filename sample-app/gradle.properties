# Sample app lives alongside the plugin and uses the same build hygiene.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache intentionally OFF for the sample: the ArchGuard check
# task is `@UntrackedTask` and configuration cache + untracked = extra noise
# for a demo project. Flip to true in a real app if you want it.
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
