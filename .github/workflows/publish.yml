name: Publish to GitHub Packages

# Fires only on tags of the form v0.1.0, v1.2.3, etc. Keeps publish paths
# narrow and deliberate — no stray releases from pushes to a feature branch.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish Maven artifacts to GitHub Packages.
      packages: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out the ArchGuard SDK
        uses: actions/checkout@v4
        with:
          repository: dmishra2022/archguard
          path: .archguard-sdk

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install ArchGuard SDK to mavenLocal
        run: |
          cd .archguard-sdk
          mvn -q -DskipTests install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: |
          # vX.Y.Z[-whatever] → X.Y.Z[-whatever]
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Override gradle.properties so the published coords match the tag.
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
          echo "Publishing version: $VERSION"

      - name: Build + test
        run: ./gradlew build --no-daemon --console=plain

      - name: Publish to GitHub Packages
        env:
          # GITHUB_TOKEN is injected by Actions and has `packages: write`
          # because of the permissions block above. The plugin's
          # build.gradle.kts reads these env vars.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew
          :plugin:publishAllPublicationsToGitHubPackagesRepository
          :archunit-rules:publishAllPublicationsToGitHubPackagesRepository
          --no-daemon --console=plain
