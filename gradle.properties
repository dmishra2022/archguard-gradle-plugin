# Project-wide Gradle properties.
#
# These values are picked up by every subproject unless explicitly overridden.
# Rationale is inline so a new maintainer never has to guess why a flag is set.

# ----- Publication coordinates ------------------------------------------------
# The group and version apply to every published artifact (plugin + archunit-rules).
# Keep in lockstep with the Git tag used to trigger .github/workflows/publish.yml.
group   = io.archguard.gradle
version = 0.1.0-SNAPSHOT

# ----- Build performance ------------------------------------------------------
# Parallel: safe because our subprojects do not share mutable state.
# Configuration cache: enabled so Gradle serialises the task graph and we get sub-second re-runs.
# Caching: local build cache so repeated test runs on the same inputs skip.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# ----- Kotlin ------------------------------------------------------------------
# K2 is Kotlin 2.x default; stated explicitly so a toolchain upgrade cannot silently flip it.
kotlin.code.style=official

# ----- Compatibility -----------------------------------------------------------
# ArchGuard SDK targets Java 17 bytecode (archguard pom: maven.compiler.release=17), so this
# plugin targets 17 for maximum consumer compatibility. The toolchain picks whatever current
# JDK is available; `release = 17` controls the actual bytecode level.
